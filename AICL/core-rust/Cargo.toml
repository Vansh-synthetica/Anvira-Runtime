[package]
name = "aicl-core"
version = "0.1.0"
edition = "2021"
description = "AICL - Adaptive Inter-Module Communication Language - Native Rust Core"
license = "MPL-2.0"
repository = "https://github.com/LocalHouseLLM/AICL"
readme = "README.md"
rust-version = "1.75"

[features]
default = ["std"]
std = []

[dependencies]
uuid = { version = "1", features = ["v4"] }
crc32fast = "1.3"
byteorder = "1.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# windows-sys was declared here but never imported in any source file (confirmed
# by grep for `windows::`, `Win32_`, `CreateFileA`, `GetLastError`, `WIN32`).
# Removed to allow --offline builds on machines without this crate cached.
# Re-add the line below if Win32 API bindings are introduced in future source.
# windows-sys = { version = "0.52", features = ["Win32_System_Memory", "Win32_Foundation"] }

[lib]
name = "aicl_core"
path = "src/lib.rs"
