[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nomi"
version = "0.1.0"
description = "Nomi - The Identity Layer for AI. Part of the LocalHouseLLM ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LocalHouseLLM", email = "vanshbukkarwal@localhousellm" }
]
keywords = ["ai", "identity", "local-first", "llm", "fastapi", "privacy"]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12", # Required for FastAPI OAuth2 form data
    
    # Database
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0", # Async PostgreSQL driver
    "alembic>=1.13.3", # Database migrations
    
    # Validation & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0", # For Pydantic EmailStr
    
    # Security & Auth
    "python-jose[cryptography]>=3.3.0", # JWT handling
    "bcrypt>=4.2.0", # Password hashing
    "redis>=5.0.8",
    "aiosqlite>=0.20.0", # SQLite driver for the bundled desktop launch path
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2", # For testing FastAPI
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "types-python-jose>=3.3.4",
]
desktop = [
    "pyinstaller>=6.10.0",
]

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "B008",  # FastAPI uses Depends/Query call defaults intentionally.
    "E501",  # Long migration declarations are clearer than heavily wrapped calls.
    "UP043", # Keep AsyncGenerator[T, None] explicit for readability.
    "UP046", # PEP 695 generic syntax is not yet universal in Python projects.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy Configuration ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# --- Hatch build configuration ---
[tool.hatch.build.targets.wheel]
packages = ["app"]
