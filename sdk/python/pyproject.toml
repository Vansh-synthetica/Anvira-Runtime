[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvira-client"
version = "1.0.0"
description = "Client SDK for Anvira Runtime (detect, install-with-consent, connect, models, chat, ORCHA jobs, memory). Stdlib only."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["anvira_client*"]
