[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvira-runtime"
version = "1.0.0"
description = "Anvira Runtime - shared local intelligence runtime (ORCHA + Nomi + AICL) with a local API, CLI and SDK."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.5,<3",
    "anvira-client>=1.0",
]

[project.optional-dependencies]
# Everything the supervised services need to run (ORCHA + Nomi).
orcha = ["langgraph>=1.0", "PyYAML>=6.0", "mcp"]
nomi = [
    "sqlalchemy>=2.0.35", "aiosqlite>=0.20", "alembic>=1.13", "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2", "pydantic-settings>=2.5", "email-validator>=2.2", "python-multipart>=0.0.12",
]
all = ["anvira-runtime[orcha,nomi]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
anvira = "anvira_runtime.cli.main:main"

[tool.setuptools.packages.find]
include = ["anvira_runtime*"]

[tool.setuptools.package-data]
"anvira_runtime.models" = ["catalog.json"]
